# Apache reverse proxy for the Node.js mrbussey site.
# Enable required modules first:
#   a2enmod proxy proxy_http headers rewrite

<VirtualHost *:80>
    ServerName www.mrbussey.com
    ServerAlias mrbussey.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/mrbussey-error.log
    CustomLog ${APACHE_LOG_DIR}/mrbussey-access.log combined
</VirtualHost>

# For HTTPS, create or enable a matching :443 VirtualHost and keep the
# ProxyPass/ProxyPassReverse directives pointed at http://127.0.0.1:3000/.
